# Deploy the app to Cloudflare Workers (via @opennextjs/cloudflare).
#
# Trigger: push to `prod` only. The team develops on `dev` and merges
# `dev -> prod` to cut a release; we never deploy from `dev`.
#
# Build-time env: this app requires NO public build-time env vars. Auth, DB and
# storage are all Cloudflare runtime bindings/secrets, so there is nothing to
# inject at `next build` time. If a required NEXT_PUBLIC_* build var is ever
# added, expose it here (from `secrets`/`vars`) before the deploy step.
#
# Worker RUNTIME secrets (BETTER_AUTH_SECRET, BETTER_AUTH_URL, RESEND_API_KEY,
# EMAIL_FROM) are configured on Cloudflare (`wrangler secret put ...` / dashboard),
# NOT in this workflow. This workflow only needs the Cloudflare API credentials
# below to authenticate the deploy + D1 migrations.

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [prod]
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Cancel an in-progress deploy if a newer commit lands on the same ref.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Apply D1 migrations to the remote database BEFORE deploying the new
      # Worker, so the schema is ready when the new code goes live.
      - name: Apply D1 migrations (remote)
        run: pnpm exec wrangler d1 migrations apply storage-app-db --remote

      # `pnpm run deploy` = `opennextjs-cloudflare build && opennextjs-cloudflare
      # deploy`. The OpenNext build must run before the deploy, so we call the
      # script directly instead of cloudflare/wrangler-action. wrangler/opennext
      # read CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID from the env above.
      - name: Build & deploy (OpenNext -> Workers)
        run: pnpm run deploy
